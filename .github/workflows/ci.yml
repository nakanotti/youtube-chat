name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: "0 0 * * *"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - name: Install modules
        run: npm ci
      - name: Supply-chain check
        run: npm run check-supply-chain
      - name: Audit signatures
        run: npm run audit-signatures
      - name: Check format
        run: npm run format-check
      - name: Run Eslint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - name: Install modules
        run: npm ci
      - name: Supply-chain check
        run: npm run check-supply-chain
      - name: Audit signatures
        run: npm run audit-signatures
      - name: Run unit test
        run: npm test
