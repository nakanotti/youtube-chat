name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: "0 0 * * *"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - name: Install modules
        run: npm ci
      - name: Supply-chain check
        run: npm run check-supply-chain
      - name: Audit signatures
        run: npm run audit-signatures
      - name: Check format
        run: npm run format-check
      - name: Run Eslint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - name: Install modules
        run: npm ci
      - name: Supply-chain check
        run: npm run check-supply-chain
      - name: Audit signatures
        run: npm run audit-signatures
      - name: Run unit test
        run: npm test
