name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: "0 0 * * *"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - name: Install modules
        run: npm ci
      - name: Check format
        run: npm run format-check
      - name: Run Eslint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - name: Install modules
        run: npm ci
      - name: Run unit test
        run: npm test
